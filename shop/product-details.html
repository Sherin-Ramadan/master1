<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Fitverse</title>
    <link rel="stylesheet" href="product-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Spinner -->
    <div class="spinner-container">
        <div class="spinner"></div>
    </div>

    <!-- Product Details Main -->
    <main class="product-details-main">
        <div class="container">
            <a href="shop.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Shop</a>
            
            <div class="product-details-grid" id="product-details-container">
                <!-- Product details will be loaded here via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Cart Notification -->
    <div class="cart-notification" id="cart-notification">
        <span id="notification-message">Item added to cart!</span>
    </div>

    <script src="product-details.js"></script>
</body>
</html>
