<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session | Fitverse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="booking.css">
</head>
<body>
    <section class="booking-section">
        <div class="container">
            <div class="booking-header">
                <h1>Book a Session</h1>
                <p>Fill out the form below to schedule your session</p>
            </div>

            <div class="booking-form">
                <div class="form-group">
                    <label for="session-type">Session Type</label>
                    <select id="session-type" required>
                        <option value="">Select session type</option>
                        <option value="personal-training">Personal Training</option>
                        <option value="nutrition-consultation">Nutrition Consultation</option>
                        <option value="fitness-assessment">Fitness Assessment</option>
                        <option value="online-coaching">Online Coaching</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="session-date">Date</label>
                    <input type="date" id="session-date" required>
                </div>

                <div class="form-group">
                    <label for="session-time">Time</label>
                    <select id="session-time" required>
                        <option value="">Select time</option>
                        <option value="09:00">9:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="12:00">12:00 PM</option>
                        <option value="13:00">1:00 PM</option>
                        <option value="14:00">2:00 PM</option>
                        <option value="15:00">3:00 PM</option>
                        <option value="16:00">4:00 PM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes</label>
                    <textarea id="notes" rows="4" placeholder="Any special requests or information..."></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submit-booking">Confirm Booking</button>
            </div>
        </div>
    </section>

    <script src="booking.js"></script>
</body>
</html>
